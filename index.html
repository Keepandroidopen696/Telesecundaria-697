<!DOCTYPE html>
<html lang="es-MX">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>697 - Alerta</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@900&display=swap');
body{margin:0;background:#080808;display:flex;align-items:center;justify-content:center;min-height:100vh;font-family:'Inter',sans-serif;padding:20px}
.alerta{max-width:600px;width:100%;background:#1a1a00;border:2px solid #ffcc00;border-radius:18px;padding:30px;text-align:center;box-shadow:0 0 40px rgba(255,204,0,0.4);animation:pulse 1.5s infinite}
@keyframes pulse{0%{box-shadow:0 0 20px rgba(255,204,0,0.4)}50%{box-shadow:0 0 40px rgba(255,204,0,0.8)}100%{box-shadow:0 0 20px rgba(255,204,0,0.4)}}
.icono{font-size:60px;margin-bottom:10px;animation:parpadea 1s infinite}
@keyframes parpadea{0%,100%{opacity:1}50%{opacity:0.5}}
h1{font-family:'Anton';font-size:36px;color:#ffcc00;margin:0;line-height:1}
.sub{color:#fff;font-size:18px;font-weight:900;margin:15px 0}
.barra{width:100%;height:10px;background:#333;border-radius:10px;overflow:hidden;margin:20px 0}
.progreso{height:100%;width:0%;background:#ffcc00;animation:carga 3s forwards}
@keyframes carga{to{width:100%}}
p{color:#aaa;font-size:13px;margin-top:15px}
.contador{font-family:'Anton';font-size:48px;color:#ffcc00}
</style>
</head>
<body>
<div class="alerta">
<div class="icono">⚠️</div>
<h1>2 CUENTAS DETECTADAS</h1>
<div class="sub">Están siendo registradas para la página web</div>
<div class="contador" id="count">2</div>
<div class="barra"><div class="progreso"></div></div>
<p>🔍 Analizando cuentas... <br> Agregando a base de datos 697 <br> <b style="color:#fff">Total ahora: 12 cuentas (3 reales + 7 falsas + 2 nuevas)</b></p>
</div>

<script>
let c=0;
setInterval(()=>{
  c++;
  document.getElementById('count').innerText = c%3===0 ? "2 CUENTAS" : "2";
},500);
setTimeout(()=>{ alert("2 cuentas nuevas registradas we - actualiza tu lista"); },3500);
</script>
</body>
</html>
